[project]
name = "order-to-cash-connector"
version = "0.1.0"
description = "ERP & Supply Chain Order Portal — event-sourced, multi-cloud (AWS/Azure), multi-tenant order routing."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.3",
    "pydantic==2.9.2",
    "strawberry-graphql==0.246.2",
    # 3.3 moved ExecutionContext; strawberry 0.246 cannot import it.
    "graphql-core>=3.2.0,<3.3.0",
    "boto3==1.35.36",
    "azure-identity==1.19.0",
    "azure-keyvault-secrets==4.9.0",
    "azure-servicebus==7.12.3",
    "PyJWT==2.9.0",
    "cryptography==50.0.1",  # PyJWT's RS256 backend — the tokens we verify are always RS256
    "pyotp==2.9.0",
    "python-dateutil==2.9.0",
    "python-ulid==2.7.0",
    # Used at runtime by mapping/infrastructure/agent_launcher.py (HttpAdapterRunLauncher
    # calls erp-agent-service) — not just tests. Confirmed the hard way: a `pip install .`
    # production image crashes the worker with ModuleNotFoundError without this here.
    "httpx==0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "hypothesis==6.112.1",
    "mypy==1.11.2",
    "ruff==0.6.9",
    "import-linter==2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# --- static typing: strict across our code ---
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_any_generics = true
namespace_packages = true
mypy_path = "src"
exclude = ["migrations/"]

# --- lint + format ---
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH", "RUF"]

# --- tests ---
[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["src", "tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["src"]
branch = true

# --- architecture boundaries (enforced): domain never imports infra/hosts ---
[tool.importlinter]
root_package = "src"
# Required because the "framework-free" contract forbids external packages (boto3/fastapi/strawberry).
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture (shared <- modules <- api/worker)"
type = "layers"
layers = [
    "src.api | src.worker",
    "src.modules",
    "src.shared",
]

[[tool.importlinter.contracts]]
name = "Domain is framework-free (no cloud SDK / web framework in domain or shared kernel)"
type = "forbidden"
source_modules = ["src.modules", "src.shared.eventsourcing"]
forbidden_modules = ["boto3", "azure", "fastapi", "strawberry"]

# `reference` is master data (catalog/connections/tenancy) — a leaf subdomain. It must not
# depend on the order-lifecycle (`sales`) or edge (`integration`) groups; those depend on
# it, never the reverse. Guards the module grouping introduced in Increment 6.
[[tool.importlinter.contracts]]
name = "Reference is a leaf subdomain (no imports from sales or integration)"
type = "forbidden"
source_modules = ["src.modules.reference"]
forbidden_modules = ["src.modules.sales", "src.modules.integration"]

# After moving `CanonicalStatus` to `shared` (ADR-0018), `sales` no longer imports
# `integration`. The shipment/invoice -> order link is an event-driven saga (ordering
# reacts to event-type strings), not a code dependency — enforce that it stays that way.
[[tool.importlinter.contracts]]
name = "Sales does not import integration (the link is an event-driven saga)"
type = "forbidden"
source_modules = ["src.modules.sales"]
forbidden_modules = ["src.modules.integration"]
