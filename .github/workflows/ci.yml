name: CI

# Quality gates — the same checks as .githooks/pre-commit and the `quality-gates`
# steering, enforced server-side on every PR and push to main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python gates (ruff, import-linter, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to diff changed files vs the base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project + dev tools
        run: python -m pip install -e ".[dev]"

      # ruff is scoped to the Python files this change touches, exactly like the
      # pre-commit hook (boy-scout rule). The repo carries pre-existing, repo-wide ruff
      # debt from before ruff was adopted; failing CI on untouched legacy files would be
      # noise. New/changed code must still be clean. lint-imports + pytest run repo-wide.
      - name: Determine changed Python files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          FILES="$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.py' | tr '\n' ' ')"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed Python files: ${FILES:-<none>}"

      - name: ruff format (changed files)
        if: steps.changed.outputs.files != ''
        run: python -m ruff format --check ${{ steps.changed.outputs.files }}

      - name: ruff check (changed files)
        if: steps.changed.outputs.files != ''
        run: python -m ruff check ${{ steps.changed.outputs.files }}

      - name: import-linter (architecture contracts, repo-wide)
        run: lint-imports

      - name: pytest (memory profile)
        env:
          APP_PROFILE: memory
        run: python -m pytest src tests -q

  ui:
    name: UI build (tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm --prefix ui ci
      - name: Build
        run: npm --prefix ui run build
