# Reusable: the Python gates shared by the API and worker pipelines. Not triggered directly.
name: Python checks

on:
  workflow_call:

jobs:
  checks:
    name: ruff, import-linter, pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to diff changed files vs the base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project + dev tools
        run: python -m pip install -e ".[dev]"

      # ruff is scoped to the Python files this change touches, like the pre-commit hook.
      # Repo-wide ruff debt from before ruff was adopted would otherwise fail every PR.
      # lint-imports and pytest run repo-wide.
      - name: Determine changed Python files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          FILES="$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.py' | tr '\n' ' ')"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed Python files: ${FILES:-<none>}"

      - name: ruff format (changed files)
        if: steps.changed.outputs.files != ''
        run: python -m ruff format --check ${{ steps.changed.outputs.files }}

      - name: ruff check (changed files)
        if: steps.changed.outputs.files != ''
        run: python -m ruff check ${{ steps.changed.outputs.files }}

      - name: import-linter (architecture contracts)
        run: lint-imports

      - name: pytest (memory profile)
        env:
          APP_PROFILE: memory
        run: python -m pytest src tests -q
