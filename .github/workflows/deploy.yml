name: Deploy (staging)

# Build + push images, apply Terraform, run migrations, roll ECS, ship the UI. Triggers:
#   - push to main  -> auto-deploy staging
#   - manual run    -> workflow_dispatch (set rebuild_odoo=true to force a new Odoo image)
# The `staging` GitHub Environment can carry a protection rule (required reviewer) if you
# want a manual approval gate before each deploy. Auth via GitHub OIDC (no stored keys).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_odoo:
        description: "Rebuild + push a new Odoo image even if Dockerfile.odoo didn't change"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
  TF_VAR_odoo_db_password: ${{ secrets.ODOO_DB_PASSWORD }}

jobs:
  deploy:
    name: build, apply, migrate, ship UI
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to diff Dockerfile.odoo for the rebuild_odoo check

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR login
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"

      - name: terraform init
        working-directory: infra/terraform
        run: terraform init -backend-config=envs/staging.s3.tfbackend

      # Create (or no-op if they already exist) the ECR repos BEFORE the docker push below.
      # On a brand-new account, `docker push` to a repo that doesn't exist yet fails —
      # this makes the very first deploy self-sufficient instead of needing a human to
      # `terraform apply` from their laptop first.
      - name: terraform apply -target=module.registry (ensure ECR repos exist)
        working-directory: infra/terraform
        run: |
          terraform apply -input=false -auto-approve -target=module.registry \
            -var-file=envs/staging.tfvars

      # What Odoo is running right now, from state — NOT a value we invented. Terraform
      # variables don't persist across runs; a plain `""` here would resolve to the
      # unpushed `:bootstrap` default and take Odoo down on every deploy that isn't
      # rebuilding it.
      - name: Read Odoo's currently-applied image
        working-directory: infra/terraform
        run: echo "CURRENT_ODOO_IMAGE=$(terraform output -raw odoo_image 2>/dev/null || true)" >> "$GITHUB_ENV"

      - name: Does Odoo need a new image?
        id: odoo_check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "rebuild=${{ inputs.rebuild_odoo }}" >> "$GITHUB_OUTPUT"
          else
            BASE="${{ github.event.before }}"
            if ! git cat-file -e "$BASE" 2>/dev/null; then
              BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            fi
            if git diff --name-only --diff-filter=ACMR "$BASE" "${{ github.sha }}" -- Dockerfile.odoo infra/terraform/modules/odoo | grep -q .; then
              echo "rebuild=true" >> "$GITHUB_OUTPUT"
            else
              echo "rebuild=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build + push api/worker images (tagged with the commit SHA)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile.api    -t "$REGISTRY/o2c/api:$TAG" .
          docker build -f Dockerfile.worker -t "$REGISTRY/o2c/worker:$TAG" .
          docker push "$REGISTRY/o2c/api:$TAG"
          docker push "$REGISTRY/o2c/worker:$TAG"
          echo "API_IMAGE=$REGISTRY/o2c/api:$TAG"       >> "$GITHUB_ENV"
          echo "WORKER_IMAGE=$REGISTRY/o2c/worker:$TAG" >> "$GITHUB_ENV"

      # Odoo is NOT rebuilt on every push (unlike api/worker): its ECR repo is
      # IMMUTABLE-tagged, each new tag replaces the running task, and attachments live on
      # the task's ephemeral disk — a redeploy on an unrelated commit would wipe them for
      # no reason. Only rebuild when Dockerfile.odoo/the odoo module changed, or when asked.
      - name: Build + push Odoo image (only when it changed)
        if: steps.odoo_check.outputs.rebuild == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile.odoo -t "$REGISTRY/o2c/odoo:$TAG" .
          docker push "$REGISTRY/o2c/odoo:$TAG"
          echo "ODOO_IMAGE=$REGISTRY/o2c/odoo:$TAG" >> "$GITHUB_ENV"

      - name: terraform apply
        working-directory: infra/terraform
        run: |
          # ODOO_IMAGE is set above only when we just built a new one. Otherwise re-pass
          # whatever Odoo is already running (CURRENT_ODOO_IMAGE, read from state before
          # this apply) — omitting the var entirely would resolve to the unpushed
          # :bootstrap default and take Odoo down.
          ODOO_VAR=()
          if [ -n "${ODOO_IMAGE:-}" ]; then
            ODOO_VAR=(-var="odoo_image=${ODOO_IMAGE}")
          elif [ -n "${CURRENT_ODOO_IMAGE:-}" ]; then
            ODOO_VAR=(-var="odoo_image=${CURRENT_ODOO_IMAGE}")
          fi
          terraform apply -input=false -auto-approve \
            -var-file=envs/staging.tfvars \
            -var="api_image=${API_IMAGE}" \
            -var="worker_image=${WORKER_IMAGE}" \
            "${ODOO_VAR[@]}"

      # Run the Alembic migration as a one-off ECS task using the api task definition with
      # a command override. Runs AFTER apply (so the task def/image exist) and the services
      # settle on the new revision.
      - name: Run DB migration (one-off ECS task)
        working-directory: infra/terraform
        run: |
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          TASKDEF=$(terraform output -raw api_task_definition_arn)
          SUBNETS=$(terraform output -json app_subnet_ids | jq -r 'join(",")')
          SG=$(terraform output -raw app_security_group_id)
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$TASKDEF" \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["python","-m","alembic","upgrade","head"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Migration exit code: $CODE"
          [ "$CODE" = "0" ] || { echo "Migration failed"; exit 1; }

      - name: Wait for services to stabilize
        working-directory: infra/terraform
        run: |
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          aws ecs wait services-stable --cluster "$CLUSTER" \
            --services "o2c-staging-api" "o2c-staging-worker"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Built AFTER apply, with the real AWS endpoints baked in at build time (Vite env
      # vars are compile-time, not runtime). VITE_COGNITO_ENDPOINT_URL is left unset:
      # that proxy only exists for local dev against floci (see ui/vite.config.ts); real
      # Cognito supports CORS directly.
      # CloudFront serves the UI over HTTPS; the ALB is plain HTTP (cert-less by default —
      # see docs/deploy-aws.md). A browser on an HTTPS page can't fetch an HTTP API, so
      # GraphQL is routed through the SAME CloudFront distribution, at /graphql, to the ALB
      # as a second origin (see modules/ui's api_origin_domain). That also sidesteps CORS
      # entirely — same-origin, no Access-Control-Allow-Origin needed.
      # VITE_COGNITO_ENDPOINT_URL is forced empty: ui/.env (if a dev ever has one locally)
      # only points the floci dev-proxy at /cognito-idp and must never ship to prod, where
      # real Cognito talks to the browser directly. AuthContext.tsx maps "" to undefined.
      - name: Build UI
        working-directory: infra/terraform
        run: |
          {
            echo "VITE_GRAPHQL_URL=https://$(terraform output -raw ui_cloudfront_domain_name)/graphql"
            echo "VITE_COGNITO_REGION=${AWS_REGION}"
            echo "VITE_COGNITO_USER_POOL_ID=$(terraform output -raw cognito_user_pool_id)"
            echo "VITE_COGNITO_CLIENT_ID=$(terraform output -raw cognito_client_id)"
            echo "VITE_COGNITO_ENDPOINT_URL="
          } >> ../../ui/.env.production
          npm --prefix ../../ui ci
          npm --prefix ../../ui run build

      - name: Deploy UI (S3 + CloudFront invalidation)
        working-directory: infra/terraform
        run: |
          aws s3 sync ../../ui/dist "s3://$(terraform output -raw ui_bucket_name)" --delete
          aws cloudfront create-invalidation \
            --distribution-id "$(terraform output -raw ui_cloudfront_distribution_id)" \
            --paths "/*"
