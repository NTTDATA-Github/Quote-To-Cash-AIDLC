name: Terraform Plan

# Runs on PRs that touch infra. Posts the plan as a PR comment so infra changes are
# reviewed before merge. Auth via GitHub OIDC (no stored AWS keys).
on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write # OIDC
  contents: read
  pull-requests: write # post the plan comment

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
  TF_VAR_odoo_db_password: ${{ secrets.ODOO_DB_PASSWORD }}

jobs:
  plan:
    name: validate + plan (staging)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init
        run: terraform init -backend-config=envs/staging.s3.tfbackend

      - name: validate
        run: terraform validate

      - name: plan
        id: plan
        run: |
          terraform plan -input=false -no-color \
            -var-file=envs/staging.tfvars \
            -var="api_image=placeholder" \
            -var="worker_image=placeholder" \
            -var="odoo_image=placeholder" \
            2>&1 | tee plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('infra/terraform/plan.txt', 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated)';
            const body = `#### Terraform Plan (staging)\n\`\`\`\n${plan}\n\`\`\``;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
