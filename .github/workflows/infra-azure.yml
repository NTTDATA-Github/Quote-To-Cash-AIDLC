# Infra (Azure): validate and plan on every PR that touches infra/azure. Apply is manual only:
# start it from `main` with workflow_dispatch. It re-plans, waits for approval on the
# `staging` environment, then applies that same saved plan, so what was reviewed is what
# gets applied. Apply never runs on push or merge.
name: Infra (Azure)

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/azure/**"
      - ".github/workflows/infra-azure.yml"
  push:
    branches: [main]
    paths:
      - "infra/azure/**"
      - ".github/workflows/infra-azure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-azure-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_VERSION: "1.12.2"
  TF_IN_AUTOMATION: "true"

jobs:
  configured:
    name: Check Azure secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Azure secrets are not configured. Plan and apply are skipped; validate still runs."
          fi

  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/azure
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init (no backend)
        run: terraform init -backend=false -input=false

      - name: validate
        run: terraform validate -no-color

  plan:
    name: plan (staging)
    needs: [validate, configured]
    if: needs.configured.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_entra_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_odoo_db_password: ${{ secrets.ODOO_DB_PASSWORD }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: infra/azure
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: init (remote state)
        run: terraform init -input=false -backend-config=envs/staging.backend.tfbackend

      - name: plan (saved to tfplan)
        run: terraform plan -input=false -no-color -out=tfplan -var-file=envs/staging.tfvars

      - name: Show the full plan in the job summary
        if: always()
        run: |
          {
            echo "## Terraform plan (staging)"
            echo '```hcl'
            terraform show -no-color tfplan 2>/dev/null | tail -c 60000 || echo "(no plan file)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The plan file can hold secret values in plaintext: keep it one day, no longer.
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/azure/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: apply (staging, approval required)
    needs: [plan, configured]
    if: needs.configured.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Approval gate: the `staging` environment needs a required reviewer (repo admin sets
    # it: Settings > Environments > staging > Required reviewers). Until then this job
    # runs without a pause, so do not rely on it before that is set.
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: infra/azure
    steps:
      - uses: actions/checkout@v4

      - name: Download the reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/azure

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: init (remote state)
        run: terraform init -input=false -backend-config=envs/staging.backend.tfbackend

      # Applies the saved plan only. Terraform refuses it if the state changed since the plan.
      - name: apply saved plan
        run: terraform apply -input=false -no-color tfplan
