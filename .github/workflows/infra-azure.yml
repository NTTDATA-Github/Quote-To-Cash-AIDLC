name: Infra (Azure)

# Checks the Azure Terraform on every PR to main that touches it. `validate` needs no
# secrets. `plan` runs once the Azure secrets exist and never applies: apply stays a manual
# step (docs/deploy-azure.md).
on:
  pull_request:
    branches: [main]
    paths:
      - "infra/azure/**"
      - ".github/workflows/infra-azure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-azure-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.12.2"
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/azure
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init (no backend)
        run: terraform init -backend=false -input=false

      - name: validate
        run: terraform validate -no-color

  plan:
    name: plan (staging)
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_entra_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_odoo_db_password: ${{ secrets.ODOO_DB_PASSWORD }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: infra/azure
    steps:
      - uses: actions/checkout@v4

      - name: Skip when Azure secrets are not configured
        if: env.HAS_AZURE != 'true'
        run: |
          echo "::notice::Azure secrets are not configured (AZURE_CLIENT_ID etc.). Plan skipped; validate still ran."

      - uses: azure/login@v2
        if: env.HAS_AZURE == 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        if: env.HAS_AZURE == 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: init (remote state)
        if: env.HAS_AZURE == 'true'
        run: terraform init -input=false -backend-config=envs/staging.backend.tfbackend

      - name: plan
        if: env.HAS_AZURE == 'true'
        run: |
          terraform plan -input=false -no-color -var-file=envs/staging.tfvars | tee plan.txt
          {
            echo "## Terraform plan (staging)"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
