# Local backing services. The api and the demo's dev processes run on the host via
# scripts/local.sh; this file starts Odoo, its database, Keycloak, and the Postgres that the
# integration tests use.
services:
  # Used by tests/integration/ only. The memory profile does not need a database.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal"]
      interval: 5s
      timeout: 3s
      retries: 10

  odoo-db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 3s
      retries: 10

  odoo:
    image: odoo:17
    depends_on:
      odoo-db:
        condition: service_healthy
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8069:8069"
    entrypoint: ["/bin/bash", "/odoo-boot.sh"]
    volumes:
      - odoo-web:/var/lib/odoo
      - ./scripts/odoo-boot.sh:/odoo-boot.sh:ro

  # Identity for AdminOps sign-in. The realm (o2c, client o2c-portal, demo user operator1)
  # is baked into Dockerfile.keycloak from keycloak-realm-export.json.
  keycloak:
    build:
      context: .
      dockerfile: Dockerfile.keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"

volumes:
  pgdata:
  odoo-db-data:
  odoo-web:
