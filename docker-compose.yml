# Local backing services. api, worker, and the portal run on the host via scripts/local.sh.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Browser for the portal database. Server is the compose service name `postgres`.
  adminer:
    image: adminer:4
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8088:8080"

  # AWS emulator (SNS/SQS/Secrets Manager/Cognito). Same boto3 code targets this
  # locally and real AWS in prod — only AWS_ENDPOINT_URL differs.
  # The docker socket lets Floci start its browser console at http://localhost:4566/_floci/ui.
  # FLOCI_BASE_URL is localhost because the api and worker run on the host, not in this network.
  floci:
    image: floci/floci:latest
    user: root
    ports:
      - "4566:4566"
    environment:
      FLOCI_BASE_URL: http://localhost:4566
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  odoo-db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 3s
      retries: 10

  odoo:
    image: odoo:17
    depends_on:
      odoo-db:
        condition: service_healthy
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8069:8069"
    entrypoint: ["/bin/bash", "/odoo-boot.sh"]
    volumes:
      - odoo-web:/var/lib/odoo
      - ./scripts/odoo-boot.sh:/odoo-boot.sh:ro

  # Containerized api + worker (the same images CI builds and ECS runs). Opt-in via the
  # `app` profile so the default `docker compose up` (backing services only) and the
  # host-process flow in scripts/local.sh keep working unchanged:
  #   docker compose --profile app up --build
  # Note: inside this network the app reaches floci at http://floci:4566. floci hands back
  # queue URLs built from FLOCI_BASE_URL, so it is overridden to the in-network host here.
  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      floci:
        condition: service_started
    environment:
      APP_PROFILE: postgres
      DATABASE_URL: postgresql+psycopg2://portal:portal@postgres:5432/portal
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      ERP_ADAPTER_MODE: stub
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
      floci:
        condition: service_started
    environment:
      APP_PROFILE: postgres
      DATABASE_URL: postgresql+psycopg2://portal:portal@postgres:5432/portal
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      ERP_ADAPTER_MODE: stub
      WORKER_ROLE: all
      RECONCILE_INTERVAL_SECONDS: "30"
      LOG_LEVEL: INFO

volumes:
  pgdata:
  odoo-db-data:
  odoo-web:
